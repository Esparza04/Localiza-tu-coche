<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Localiza tu coche</title>

    <!-- MAPTILER -->
    <link
        href="https://cdn.maptiler.com/maptiler-sdk-js/latest/maptiler-sdk.css"
        rel="stylesheet"
    >

    <script src="https://cdn.maptiler.com/maptiler-sdk-js/latest/maptiler-sdk.umd.min.js"></script>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            font-family: Arial, sans-serif;

            overflow: hidden;
        }


        button,
        input,
        textarea {
            font-family: inherit;
        }


        button {
            cursor: pointer;
        }


        /* =====================================================
           CARGA INICIAL
        ===================================================== */

        #loading-screen {
            position: fixed;
            inset: 0;

            z-index: 9999;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #f5f5f5;
        }


        .loader {
            width: 40px;
            height: 40px;

            border: 4px solid #dddddd;
            border-top-color: #2388e8;

            border-radius: 50%;

            animation: spin 0.8s linear infinite;
        }


        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }


        /* =====================================================
           AUTENTICACIÓN
        ===================================================== */

        #auth-screen {
            position: fixed;
            inset: 0;

            z-index: 5000;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 24px;

            background:
                linear-gradient(
                    145deg,
                    #eef6ff,
                    #ffffff
                );
        }


        .auth-card {
            width: 100%;
            max-width: 420px;

            background: white;

            border-radius: 22px;

            padding: 30px 24px;

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.12);
        }


        .auth-logo {
            width: 58px;
            height: 58px;

            margin: 0 auto 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 18px;

            background: #2388e8;

            color: white;

            font-size: 29px;
        }


        .auth-title {
            margin: 0;

            text-align: center;

            font-size: 26px;
        }


        .auth-subtitle {
            margin:
                8px 0
                26px;

            text-align: center;

            color: #777777;

            font-size: 14px;
        }


        .form-group {
            margin-bottom: 15px;
        }


        .form-group label {
            display: block;

            margin-bottom: 6px;

            font-size: 13px;
            font-weight: 600;

            color: #444444;
        }


        .form-group input,
        .form-group textarea {

            width: 100%;

            padding: 13px 14px;

            border:
                1px solid
                #d8d8d8;

            border-radius: 10px;

            outline: none;

            font-size: 16px;

            background: white;
        }


        .form-group input:focus,
        .form-group textarea:focus {

            border-color: #2388e8;

        }


        .primary-button {

            width: 100%;

            padding: 14px;

            margin-top: 5px;

            border: none;

            border-radius: 11px;

            background: #2388e8;

            color: white;

            font-size: 16px;
            font-weight: bold;
        }


        .auth-change {

            margin-top: 22px;

            text-align: center;

            font-size: 14px;

            color: #666666;
        }


        .auth-change button {

            border: none;

            background: transparent;

            color: #2388e8;

            font-weight: bold;

            font-size: 14px;
        }


        .auth-message {

            display: none;

            margin-bottom: 15px;

            padding: 11px;

            border-radius: 9px;

            font-size: 13px;

            line-height: 1.4;
        }


        .auth-message.error {

            display: block;

            color: #a71919;

            background: #ffe8e8;
        }


        .auth-message.success {

            display: block;

            color: #176329;

            background: #e5f7e9;
        }


        #register-form {
            display: none;
        }



        /* =====================================================
           APLICACIÓN
        ===================================================== */

        #app {
            position: fixed;
            inset: 0;

            display: none;
        }


        #map {

            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;
        }



        /* =====================================================
           BARRA SUPERIOR
        ===================================================== */

        #top-interface {

            position: absolute;

            top: 15px;
            left: 15px;
            right: 15px;

            z-index: 20;

            display: flex;

            align-items: flex-start;

            pointer-events: none;
        }


        #top-interface button,
        #top-interface div {

            pointer-events: auto;
        }



        /* =====================================================
           USUARIO
        ===================================================== */

        #user-area {

            position: relative;

            margin-right: 8px;
        }


        .square-button {

            width: 44px;
            height: 44px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: none;

            border-radius: 12px;

            background: white;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.25);

            font-size: 20px;
        }


        #user-menu {

            position: absolute;

            top: 52px;
            left: 0;

            width: 230px;

            display: none;

            padding: 8px;

            background: white;

            border-radius: 13px;

            box-shadow:
                0 3px 14px
                rgba(0, 0, 0, 0.25);
        }


        #user-info {

            padding: 10px;

            border-bottom:
                1px solid
                #eeeeee;
        }


        #user-name {

            font-weight: bold;

            font-size: 14px;
        }


        #user-email {

            margin-top: 3px;

            color: #777777;

            font-size: 12px;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        .menu-button {

            width: 100%;

            padding: 11px;

            border: none;

            border-radius: 8px;

            background: transparent;

            text-align: left;

            font-size: 14px;
        }


        .menu-button:hover {

            background: #f1f1f1;
        }


        .danger {

            color: #c62828;
        }



        /* =====================================================
           SELECTOR DE GRUPOS
        ===================================================== */

        #group-area {

            position: relative;

            flex: 1;

            display: flex;
            justify-content: center;
        }


        #group-button {

            min-width: 140px;
            max-width: 210px;

            height: 44px;

            padding:
                0
                15px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 10px;

            border: none;

            border-radius: 12px;

            background: white;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.25);

            font-size: 14px;
            font-weight: 600;
        }


        #group-menu {

            position: absolute;

            top: 52px;

            width: 290px;

            max-width:
                calc(100vw - 30px);

            display: none;

            padding: 8px;

            background: white;

            border-radius: 14px;

            box-shadow:
                0 3px 15px
                rgba(0, 0, 0, 0.28);
        }


        .group-option {

            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 9px;

            background: transparent;

            text-align: left;

            font-size: 15px;
        }


        .group-option:hover {

            background: #f1f1f1;
        }


        .menu-separator {

            height: 1px;

            margin: 6px 5px;

            background: #eeeeee;
        }


        .join-title {

            padding:
                7px
                10px
                5px;

            color: #777777;

            font-size: 12px;
            font-weight: bold;
        }


        #join-row {

            display: flex;

            gap: 6px;

            padding: 5px;
        }


        #join-code {

            min-width: 0;

            flex: 1;

            padding:
                10px
                9px;

            border:
                1px solid
                #dddddd;

            border-radius: 8px;

            outline: none;

            text-transform: uppercase;
        }


        #paste-code {

            padding:
                0
                10px;

            border: none;

            border-radius: 8px;

            background: #eeeeee;
        }


        #join-group-button {

            width:
                calc(100% - 10px);

            margin:
                4px
                5px
                6px;

            padding: 10px;

            border: none;

            border-radius: 8px;

            background: #2388e8;

            color: white;

            font-weight: bold;
        }



        /* =====================================================
           CONTROLES MAPA
        ===================================================== */

        #map-controls {

            display: flex;

            flex-direction: column;

            gap: 7px;

            margin-left: 8px;
        }


        .map-control {

            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: none;

            border-radius: 11px;

            background: white;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.25);
        }



        /* ICONO CAPAS */

        .layers-icon {

            position: relative;

            width: 19px;
            height: 19px;
        }


        .layers-icon span {

            position: absolute;

            left: 50%;

            width: 13px;
            height: 13px;

            border:
                2px solid
                #357fd4;

            border-radius: 2px;

            background: white;

            transform:
                translateX(-50%)
                rotate(45deg);
        }


        .layers-icon span:nth-child(1) {
            top: 0;
        }

        .layers-icon span:nth-child(2) {
            top: 3px;
        }

        .layers-icon span:nth-child(3) {
            top: 6px;
        }



        /* UBICACIÓN */

        .location-arrow {

            width: 0;
            height: 0;

            border-left:
                7px solid transparent;

            border-right:
                7px solid transparent;

            border-bottom:
                18px solid #3f86cf;

            transform:
                rotate(45deg);
        }



        /* MENÚ CAPAS */

        #layer-menu {

            position: absolute;

            top: 0;
            right: 50px;

            width: 170px;

            display: none;

            padding: 7px;

            background: white;

            border-radius: 12px;

            box-shadow:
                0 3px 12px
                rgba(0, 0, 0, 0.25);
        }


        .layer-option {

            padding: 11px;

            border-radius: 8px;

            font-size: 14px;

            cursor: pointer;
        }


        .layer-option:hover {

            background: #eeeeee;
        }



        /* =====================================================
           UBICACIÓN USUARIO
        ===================================================== */

        .user-location {

            width: 18px;
            height: 18px;

            background: #1689ff;

            border:
                4px solid
                white;

            border-radius: 50%;

            box-shadow:
                0 0 0 3px
                rgba(22,137,255,0.28),
                0 2px 6px
                rgba(0,0,0,0.3);
        }



        /* =====================================================
           MODALES
        ===================================================== */

        .modal-background {

            position: fixed;
            inset: 0;

            z-index: 100;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                rgba(0,0,0,0.38);
        }


        .modal {

            width: 100%;
            max-width: 420px;

            padding: 22px;

            background: white;

            border-radius: 18px;

            box-shadow:
                0 10px 35px
                rgba(0,0,0,0.25);
        }


        .modal h2 {

            margin:
                0
                0
                18px;

            font-size: 21px;
        }


        .modal-buttons {

            display: flex;

            justify-content: flex-end;

            gap: 8px;

            margin-top: 20px;
        }


        .secondary-button {

            padding:
                11px
                16px;

            border: none;

            border-radius: 9px;

            background: #eeeeee;

            font-weight: bold;
        }


        .modal-create-button {

            padding:
                11px
                18px;

            border: none;

            border-radius: 9px;

            background: #2388e8;

            color: white;

            font-weight: bold;
        }


        /* =====================================================
           MENSAJES
        ===================================================== */

        #toast {

            position: fixed;

            left: 50%;
            bottom: 25px;

            z-index: 1000;

            display: none;

            max-width:
                calc(100vw - 40px);

            padding:
                12px
                17px;

            border-radius: 10px;

            background: #252525;

            color: white;

            font-size: 14px;

            transform:
                translateX(-50%);

            box-shadow:
                0 3px 12px
                rgba(0,0,0,0.25);
        }


        @media (max-width: 500px) {

            #top-interface {

                top: 12px;
                left: 12px;
                right: 12px;
            }


            .square-button,
            #group-button {

                height: 42px;
            }


            .square-button {

                width: 42px;
            }


            #group-button {

                min-width: 125px;
                max-width: 175px;
            }


            .map-control {

                width: 40px;
                height: 40px;
            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     CARGA
========================================================= -->

<div id="loading-screen">

    <div class="loader"></div>

</div>



<!-- =========================================================
     AUTENTICACIÓN
========================================================= -->

<div id="auth-screen">

    <div class="auth-card">

        <div class="auth-logo">
            P
        </div>

        <h1 class="auth-title">
            Localiza tu coche
        </h1>

        <p class="auth-subtitle">
            Tus vehículos, siempre localizados.
        </p>


        <!-- LOGIN -->

        <form id="login-form">

            <div
                id="login-message"
                class="auth-message"
            ></div>


            <div class="form-group">

                <label>
                    Correo electrónico
                </label>

                <input
                    id="login-email"
                    type="email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Contraseña
                </label>

                <input
                    id="login-password"
                    type="password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                class="primary-button"
                type="submit"
            >
                Iniciar sesión
            </button>


            <div class="auth-change">

                ¿No tienes una cuenta?

                <button
                    id="show-register"
                    type="button"
                >
                    Crear cuenta
                </button>

            </div>

        </form>



        <!-- REGISTRO -->

        <form id="register-form">

            <div
                id="register-message"
                class="auth-message"
            ></div>


            <div class="form-group">

                <label>
                    Nombre
                </label>

                <input
                    id="register-first-name"
                    type="text"
                    autocomplete="given-name"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Apellidos
                </label>

                <input
                    id="register-last-name"
                    type="text"
                    autocomplete="family-name"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Correo electrónico
                </label>

                <input
                    id="register-email"
                    type="email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Contraseña
                </label>

                <input
                    id="register-password"
                    type="password"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Repetir contraseña
                </label>

                <input
                    id="register-password-repeat"
                    type="password"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

            </div>


            <button
                class="primary-button"
                type="submit"
            >
                Crear cuenta
            </button>


            <div class="auth-change">

                ¿Ya tienes una cuenta?

                <button
                    id="show-login"
                    type="button"
                >
                    Iniciar sesión
                </button>

            </div>

        </form>

    </div>

</div>



<!-- =========================================================
     APLICACIÓN
========================================================= -->

<div id="app">

    <div id="map"></div>


    <div id="top-interface">


        <!-- USUARIO -->

        <div id="user-area">

            <button
                id="user-button"
                class="square-button"
                aria-label="Usuario"
            >
                ♙
            </button>


            <div id="user-menu">

                <div id="user-info">

                    <div id="user-name">
                        Usuario
                    </div>

                    <div id="user-email"></div>

                </div>


                <button
                    id="logout-button"
                    class="menu-button danger"
                >
                    Cerrar sesión
                </button>

            </div>

        </div>



        <!-- GRUPOS -->

        <div id="group-area">

            <button id="group-button">

                <span id="selected-group">
                    Todos
                </span>

                <span>⌄</span>

            </button>


            <div id="group-menu">


                <button
                    class="group-option"
                    data-group="all"
                >
                    Todos
                </button>


                <button
                    class="group-option"
                    data-group="personal"
                >
                    Personal
                </button>


                <div class="menu-separator"></div>


                <button
                    id="open-create-group"
                    class="group-option"
                >
                    + Crear grupo
                </button>


                <div class="menu-separator"></div>


                <div class="join-title">
                    UNIRSE A UN GRUPO
                </div>


                <div id="join-row">

                    <input
                        id="join-code"
                        type="text"
                        placeholder="Código"
                    >

                    <button
                        id="paste-code"
                        type="button"
                    >
                        Pegar
                    </button>

                </div>


                <button
                    id="join-group-button"
                    type="button"
                >
                    Unirse
                </button>


            </div>

        </div>



        <!-- MAPA -->

        <div id="map-controls">


            <button
                id="layer-button"
                class="map-control"
                aria-label="Capas"
            >

                <div class="layers-icon">

                    <span></span>
                    <span></span>
                    <span></span>

                </div>

            </button>


            <button
                id="center-location-button"
                class="map-control"
                aria-label="Centrar ubicación"
            >

                <div class="location-arrow"></div>

            </button>


            <div id="layer-menu">

                <div
                    class="layer-option"
                    data-style="streets"
                >
                    Mapa
                </div>

                <div
                    class="layer-option"
                    data-style="satellite"
                >
                    Satélite
                </div>

                <div
                    class="layer-option"
                    data-style="hybrid"
                >
                    Satélite + calles
                </div>

            </div>


        </div>

    </div>

</div>



<!-- =========================================================
     CREAR GRUPO
========================================================= -->

<div
    id="create-group-modal"
    class="modal-background"
>

    <div class="modal">

        <h2>
            Crear grupo
        </h2>


        <div class="form-group">

            <label>
                Nombre del grupo
            </label>

            <input
                id="new-group-name"
                type="text"
                maxlength="50"
                placeholder="Ej. Familia"
            >

        </div>


        <div class="form-group">

            <label>
                Descripción
            </label>

            <textarea
                id="new-group-description"
                rows="3"
                maxlength="250"
                placeholder="Opcional"
            ></textarea>

        </div>


        <div class="modal-buttons">

            <button
                id="cancel-create-group"
                class="secondary-button"
            >
                Cancelar
            </button>


            <button
                id="create-group-button"
                class="modal-create-button"
            >
                Crear
            </button>

        </div>

    </div>

</div>



<div id="toast"></div>



<script>

    /* =========================================================
       CONFIGURACIÓN
    ========================================================= */

    const MAPTILER_API_KEY =
        "lJBAab5ODxqdFUoXLLm8";


    const SUPABASE_URL =
        "https://jpjnmdxkkqozqnxwnhmh.supabase.co";


    const SUPABASE_KEY =
        "sb_publishable_tqrKEj4LlKKR4FSns3AoUA_s6YPnOeo";



    /* =========================================================
       SUPABASE
    ========================================================= */

    const supabaseClient =
        window.supabase.createClient(
